apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
spec:
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
      - name: ui-container
        image: axionappacrakkc01.azurecr.io/axion-dashboard:170
        ports:
        - containerPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: axion-ui-service
spec:
  type: ClusterIP
  selector:
    app: ui
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP


